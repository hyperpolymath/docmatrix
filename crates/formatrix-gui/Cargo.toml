# SPDX-License-Identifier: MPL-2.0
[package]
name = "formatrix-gui"
description = "Gossamer GUI for Formatrix Docs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "formatrix_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "formatrix-gui"
path = "src/main.rs"

[dependencies]
formatrix-core = { path = "../formatrix-core" }

# A sibling checkout exists in the developer estate but not on CI runners or in
# published source archives. Pin the actual upstream repository so this
# workspace is self-resolving and reproducible outside that local layout.
gossamer-rs = { git = "https://github.com/metadatastician/gossamer.git", rev = "73d8c077616777cdcd99a3c3eda50d5fa8865e2c" }

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Hashing for document events
sha2 = "0.10"

name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Checkout casket-ssg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: hyperpolymath/casket-ssg
          path: .casket-ssg
      - name: Setup GHCup
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: '9.8.2'
          cabal-version: '3.10'
      - name: Cache Cabal
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            .casket-ssg/dist-newstyle
          key: ${{ runner.os }}-casket-${{ hashFiles('.casket-ssg/casket-ssg.cabal') }}
      - name: Build casket-ssg
        working-directory: .casket-ssg
        run: cabal build
      - name: Build site
        run: |
          mkdir -p site _site
          # Generate index.md from README if site/index.md doesn't exist
          if [ ! -f site/index.md ]; then
            if [ -f README.adoc ]; then
              # Convert AsciiDoc to Markdown (basic conversion)
              echo "---" > site/index.md
              echo "title: $(basename $PWD)" >> site/index.md
              echo "date: $(date +%Y-%m-%d)" >> site/index.md
              echo "---" >> site/index.md
              cat README.adoc >> site/index.md
            elif [ -f README.md ]; then
              echo "---" > site/index.md
              echo "title: $(basename $PWD)" >> site/index.md
              echo "date: $(date +%Y-%m-%d)" >> site/index.md
              echo "---" >> site/index.md
              cat README.md >> site/index.md
            else
              echo "---" > site/index.md
              echo "title: $(basename $PWD)" >> site/index.md
              echo "date: $(date +%Y-%m-%d)" >> site/index.md
              echo "---" >> site/index.md
              echo "" >> site/index.md
              echo "# $(basename $PWD)" >> site/index.md
              echo "" >> site/index.md
              echo "Documentation coming soon." >> site/index.md
            fi
          fi
          cd .casket-ssg && cabal run casket-ssg -- build ../site ../_site
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

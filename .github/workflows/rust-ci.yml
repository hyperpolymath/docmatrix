# SPDX-License-Identifier: MPL-2.0
# The shared workflow and transitive dependencies are recorded in actions.lock.
name: Rust CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-ci:
    uses: hyperpolymath/proven-cicd-and-workflows/.github/workflows/rust-ci.yml@9eb0bbf9bd80b7964ce5b9957e75821b3cd4a55b
    with:
      doc_packages: "-p formatrix-core -p docmatrix-data"
